<form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
    <!-- ID Field -->
    <mat-form-field class="mat-form-field" appearance="outline">
        <mat-label matTooltip="Auto-Generated ID">ID</mat-label>
        <input matInput type="number" id="id" formControlName="id" [appHighlightOnFocus]="'gainsboro'" [appHighlightOnBlur]="'honeydew'"/>
    </mat-form-field>

    <!-- Title Field -->
    <mat-form-field class="mat-form-field" appearance="outline">
        <mat-label matTooltip="Enter Book Title">Title</mat-label>
        <input matInput type="text" id="title" formControlName="title" placeholder="Enter Book Title" [appHighlightOnFocus]="'aquamarine'" [appHighlightOnBlur]="'burlywood'"/>
    </mat-form-field>

    <!-- Author Name Field -->
    <mat-form-field class="mat-form-field" appearance="outline">
        <mat-label matTooltip="Enter Book Author">Author</mat-label>
        <input matInput type="text" id="author" formControlName="author" placeholder="Enter Book Author Name" [appHighlightOnFocus]="'orange'" [appHighlightOnBlur]="'navajowhite'"/>
    </mat-form-field>
    
    <!-- Genre Field -->
    <mat-form-field class="mat-form-field" appearance="outline">
        <mat-label matTooltip="Enter Book Genre">Genre</mat-label>
        <input matInput type="text" id="genre" formControlName="genre" placeholder="Enter Book Genre" [appHighlightOnFocus]="'gold'" [appHighlightOnBlur]="'beige'"/>
    </mat-form-field>

    <!-- Publication Year Field -->
    <mat-form-field class="mat-form-field" appearance="outline">
        <mat-label matTooltip="Enter Book Publication Year">Publication Year</mat-label>
        <input matInput type="text" id="publicationYear" formControlName="publicationYear" placeholder="Enter Book Publication Year" [appHighlightOnFocus]="'lightblue'" [appHighlightOnBlur]="'lavender'"/>
    </mat-form-field>

    <!-- Price Field -->
    <mat-form-field class="mat-form-field" appearance="outline">
        <mat-label matTooltip="Enter Book Price">Price</mat-label>
        <input matInput type="text" id="price" formControlName="price" placeholder="Enter Book Price" [appHighlightOnFocus]="'peachpuff'" [appHighlightOnBlur]="'lightcoral'"/>
    </mat-form-field>

    <!-- Quote Field -->
    <mat-form-field class="mat-form-field" appearance="outline">
        <mat-label matTooltip="Enter Quote By Author">Quote</mat-label>
        <input matInput type="text" id="quote" formControlName="quote" placeholder="Enter Quote By Author" [appHighlightOnFocus]="'rosybrown'" [appHighlightOnBlur]="'lightsteelblue'"/>
    </mat-form-field>

    <!-- Ratings Field -->
    <mat-form-field class="mat-form-field" appearance="outline">
        <mat-label matTooltip="Enter Book Ratings If Available">Ratings</mat-label>
        <input matInput type="text" id="rating" formControlName="rating" placeholder="Enter Ratings If Available" [appHighlightOnFocus]="'thistle'" [appHighlightOnBlur]="'skyblue'"/>
    </mat-form-field>

    <!-- Submit and Back Buttons -->
    <div class="button-group">
        <button mat-raised-button color="primary" type="submit" matTooltip="Submit Button">Submit</button>
        <button mat-flat-button color="tertiary" type="button" matTooltip="Back To Book List Button" (click)="navigateToBookList()">Back To Book List</button>
    </div>
</form>

<div *ngIf="error" class="error">{{ error }}</div>
