<form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
    <!-- ID Field -->
    <div class="form-group">
        <label for="id">ID</label>
        <input type="number" id="id" formControlName="id" />
    </div>

    <!-- Title Field -->
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" formControlName="title" placeholder="Enter Book Title" />
    </div>

    <!-- Author Field -->
    <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" formControlName="author" placeholder="Enter Book Author"/>
    </div>

    <!-- Genre Field -->
    <div class="form-group">
        <label for="genre">Genre</label>
        <input type="text" id="genre" formControlName="genre" placeholder="Enter Book Genre"/>
    </div>

    <!-- Publication Year Field -->
    <div class="form-group">
        <label for="publicationYear">Publication Year</label>
        <input type="text" id="publicationYear" formControlName="publicationYear" placeholder="Enter Book Publication Year"/>
    </div>

    <!-- Ratings Field -->
    <div class="form-group">
        <label for="rating">Ratings</label>
        <input type="text" id="rating" formControlName="rating" placeholder="Enter Ratings If Available"/>
    </div>

    <!-- Image Field -->
     <div class="form-group">
        <label for="image">Image</label>
        <input type="text" id="image" formControlName="image" placeholder="Not Necessarily Required! Default Image Will Be Added"/>
     </div>

    <!-- Conditional Button rendering based on whether ID exists or not (Add or Update) -->
  <button type="submit" *ngIf="bookForm.get('id')?.value">Update Book</button>
  <button type="submit" *ngIf="!bookForm.get('id')?.value">Add Book</button>

  <!-- Back Button -->
  <button type="button" (click)="navigateToBookList()">Back To Book List</button>
</form>
