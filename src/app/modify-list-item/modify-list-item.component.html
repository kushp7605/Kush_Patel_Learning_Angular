<form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
    <!-- ID Field -->
    <div class="form-group">
        <label for="id">ID</label>
        <input type="number" id="id" formControlName="id" [appHighlightOnFocus]="'gainsboro'" [appHighlightOnBlur]="'honeydew'"/>
    </div>

    <!-- Title Field -->
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" formControlName="title" placeholder="Enter Book Title" [appHighlightOnFocus]="'aquamarine'" [appHighlightOnBlur]="'burlywood'" appAutoFocus/>
    </div>

    <!-- Author Name Field -->
    <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" formControlName="author" placeholder="Enter Book Author Name" [appHighlightOnFocus]="'orange'" [appHighlightOnBlur]="'navajowhite'"/>
    </div>
    
    <!-- Genre Field -->
    <div class="form-group">
        <label for="genre">Genre</label>
        <input type="text" id="genre" formControlName="genre" placeholder="Enter Book Genre" [appHighlightOnFocus]="'gold'" [appHighlightOnBlur]="'beige'"/>
    </div>

    <!-- Publication Year Field -->
    <div class="form-group">
        <label for="publicationYear">Publication Year</label>
        <input type="text" id="publicationYear" formControlName="publicationYear" placeholder="Enter Book Publication Year" [appHighlightOnFocus]="'lightblue'" [appHighlightOnBlur]="'lavender'"/>
    </div>

    <!-- Price Field -->
    <div class="form-group">
        <label for="price">Price</label>
        <input type="text" id="price" formControlName="price" placeholder="Enter Book Price" [appHighlightOnFocus]="'peachpuff'" [appHighlightOnBlur]="'lightcoral'"/>
    </div>

    <!-- Quote Field -->
    <div class="form-group">
        <label for="quote">Quote</label>
        <input type="text" id="quote" formControlName="quote" placeholder="Enter Quote By Author" [appHighlightOnFocus]="'rosybrown'" [appHighlightOnBlur]="'lightsteelblue'"/>
    </div>

    <!-- Ratings Field -->
    <div class="form-group">
        <label for="rating">Ratings</label>
        <input type="text" id="rating" formControlName="rating" placeholder="Enter Ratings If Available" [appHighlightOnFocus]="'thistle'" [appHighlightOnBlur]="'skyblue'"/>
    </div>

    <!-- Button rendering based on whether ID exists or not (Add or Update Based On Submit Button) -->
    <button type="submit">Submit</button>

    <!-- Back Button -->
    <button type="button" (click)="navigateToBookList()">Back To Book List</button>
</form>

<div *ngIf="error" class="error">{{ error }}</div>
