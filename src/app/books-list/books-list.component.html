<div *ngFor="let book of books">
  <mat-card class="book-card">
  <app-books-list-item [book]="book" [showRating]="book.showRating"></app-books-list-item>
  
  <!-- Edit and Delete Buttons -->
  <div class="button-container">
    <button mat-raised-button color="primary" matTooltip="Edit Book" (click)="editBook(book.id)">Edit</button>
    <button mat-fab color="tertiary" matTooltip="Delete Book" (click)="deleteBook(book.id)"><mat-icon>delete</mat-icon></button>
  </div>
  </mat-card>
</div>

<div *ngIf="error" class="error">{{ error }}</div>
